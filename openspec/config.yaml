schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Silka, capa de orquestación sobre agent-rack. Claude (u otro harness) es el
  manager: planifica y delega trabajo de código a Codex, Cursor y OpenCode en modo
  headless, y Silka aísla cada tarea en un git worktree, verifica con comandos que corre
  ella misma (nunca con lo que diga el agente), presenta fichas de revisión, mezcla en
  orden (cola de un solo escritor) e integra por oleadas.
  Principios (detalle en docs/specs/silka-v1.md): el ahorro de tokens sale de la
  arquitectura (Code Mode: API tipada silka.d.ts + silka_execute), nunca de recortar
  información; pocas dependencias; seguridad por defecto (docs/architecture/security.md);
  Windows es plataforma de primera clase.
  Por qué de cada decisión: docs/adr/. Concurrencia: docs/architecture/concurrency.md.
  Trazabilidad requisito → ADR → código → prueba: docs/architecture/traceability.md.

rules:
  specs:
    - Conserva los IDs existentes (FR-*, NFR-*, SEC-*) al inicio del título de cada Requirement.
    - Cada Scenario nombra la prueba que lo cubre entre paréntesis (T-*, HL-*, TP-*, etc.) si existe.
    - Las métricas de los NFR se escriben como escenarios medibles (umbral explícito).
  tasks:
    - Cada tarea debe poder delegarse sola a un agente con Silka: alcance (archivos), entregable y verify (comando real).
    - Indica dependencias entre tareas cuando las haya.
  proposal:
    - Di siempre qué queda fuera de alcance.
